name: Build & Release (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows-release:
    runs-on: windows-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── Optional Windows Signing Certificate ─────────────────────────────
      # Accepted tradeoff, not a bug: without WIN_CSC_LINK/WIN_CSC_KEY_PASSWORD
      # repo secrets, the .exe below ships UNSIGNED (scripts/sign.js skips
      # silently). That means SmartScreen warns on install, which trains users
      # to click through security prompts — a real risk if a spoofed release
      # page ever shows up. The explicit warning annotation below exists so
      # that gap is visible in every run instead of a silent skip. Get a cert
      # (SignPath, DigiCert, SSL.com, etc.) and set those two secrets to close
      # it; until then this is a deliberate, known-and-accepted state.
      - name: Warn if releasing unsigned
        if: env.WIN_CSC_LINK == ''
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        run: echo "::warning::WIN_CSC_LINK is not set — this Windows build will be UNSIGNED. See the comment above this step in release.yml."

      - name: Set Windows Signing Certificate
        if: env.WIN_CSC_LINK != ''
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        shell: bash
        run: |
          echo "CSC_LINK=${{ secrets.WIN_CSC_LINK }}" >> $GITHUB_ENV
          echo "CSC_KEY_PASSWORD=${{ secrets.WIN_CSC_KEY_PASSWORD }}" >> $GITHUB_ENV

      # ── Zip Chrome Extension ─────────────────────────────────────────────
      - name: Package Chrome Extension
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Compress-Archive -Path extension/* -DestinationPath release/betterjob-chrome-extension.zip -Force

      # ── Build Standalone Next.js App & Package Electron Windows Installer 
      - name: Prepare Standalone Build
        run: node scripts/prepare-electron-build.js

      # Goes through electron-build-retry.js rather than electron-builder
      # directly so CI and local builds behave identically — it retries the
      # transient Windows unlink/rename file-lock that otherwise fails a run
      # outright. `--publish never` because the update feed is the R2 bucket
      # below, not GitHub Releases; electron-builder's `generic` provider can
      # write app-update.yml but cannot upload.
      - name: Build Electron Windows App (.exe)
        run: node scripts/electron-build-retry.js --win --publish never

      # ── Upload update artifacts to Cloudflare R2 ─────────────────────────
      # This is the feed the installed app actually polls. latest.yml is the
      # manifest electron-updater reads first: without it the app can never
      # discover a new version, so a missing upload here is a silent failure
      # rather than a loud one — hence the explicit checks.
      - name: Upload update artifacts to Cloudflare R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail

          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${R2_ACCOUNT_ID:-}" ] || [ -z "${R2_BUCKET:-}" ]; then
            echo "::error::R2 secrets are not configured. Set R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ACCOUNT_ID and R2_BUCKET in repo secrets — without them the released app cannot self-update."
            exit 1
          fi

          if [ ! -f release/latest.yml ]; then
            echo "::error::release/latest.yml is missing — electron-updater has nothing to read. Check that the electron-builder publish config is present."
            exit 1
          fi

          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          uploaded=0
          for f in release/*.exe release/*.blockmap release/latest*.yml; do
            [ -e "$f" ] || continue
            echo "Uploading $(basename "$f")"
            aws s3 cp "$f" "s3://${R2_BUCKET}/$(basename "$f")" --endpoint-url "$endpoint"
            uploaded=$((uploaded + 1))
          done

          echo "Uploaded $uploaded artifact(s) to R2."

      # ── Publish GitHub Release ───────────────────────────────────────────
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag_name != ''
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest*.yml
            release/latest*.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
