name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-latest
            platform: mac
            arch: universal
          - os: ubuntu-latest
            platform: linux
            arch: x64

    runs-on: ${{ matrix.os }}

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── macOS: optional signing & notarization credentials ──────────────
      - name: Import Apple Certificate (macOS)
        if: matrix.platform == 'mac' && env.MAC_CERTS != ''
        uses: apple-actions/import-codesign-certs@v2
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
        with:
          p12-file-base64: ${{ secrets.MAC_CERTS }}
          p12-password: ${{ secrets.MAC_CERTS_PASSWORD }}

      - name: Set Apple Notarization Credentials (macOS)
        if: matrix.platform == 'mac' && env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> $GITHUB_ENV
          echo "APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" >> $GITHUB_ENV
          echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> $GITHUB_ENV

      # ── Windows: optional signing certificate ────────────────────────────
      - name: Set Windows Signing Certificate (Windows)
        if: matrix.platform == 'win' && env.WIN_CSC_LINK != ''
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        run: |
          echo "CSC_LINK=${{ secrets.WIN_CSC_LINK }}" >> $GITHUB_ENV
          echo "CSC_KEY_PASSWORD=${{ secrets.WIN_CSC_KEY_PASSWORD }}" >> $GITHUB_ENV

      # ── Package Extension (Ubuntu runner only, once) ─────────────────────
      - name: Zip Chrome Extension (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p release
          zip -r release/betterjob-chrome-extension.zip extension/

      # ── Build standalone Next server & Package Electron App ─────────────
      - name: Prepare Standalone Build
        run: node scripts/prepare-electron-build.js

      - name: Build Electron App (${{ matrix.platform }})
        run: npx electron-builder --${{ matrix.platform }} --publish always

      # ── Upload artifacts to GitHub Release ──────────────────────────────
      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag_name != ''
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.zip
            release/*.blockmap
            release/latest*.yml
            release/latest*.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
